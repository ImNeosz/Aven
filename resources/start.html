<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New tab</title>
  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI", system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f3; color: #242424; }
    main { text-align: center; padding: 2rem; }
    h1 { margin: 0; font-size: 2rem; font-weight: 500; letter-spacing: .04em; }
    p { margin-top: .7rem; color: #6a6a66; }
    @media (prefers-color-scheme: dark) {
      body { background: #20211f; color: #eeeeea; }
      p { color: #aaa9a3; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Aven</h1>
    <p>A quiet place to begin.</p>
  </main>
</body>
</html>
